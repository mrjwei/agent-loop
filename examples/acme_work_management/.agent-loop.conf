# agent-loop configuration for acme_work_management: the settings of the original scripts/agent/ loop.
# Copy this file and .agent-loop/ to the project root.

AGENT_SETUP_CMD='pnpm install --frozen-lockfile --silent && (cd infra && pnpm install --frozen-lockfile --ignore-workspace --silent)'
# Same checks as the project's Stop hook. The infra/ type check runs only when infra/ changed and its dependencies are installed.
AGENT_VERIFY_CMD='pnpm exec tsc --noEmit && pnpm lint && pnpm test && { if { git diff --name-only origin/main...HEAD; git diff --name-only HEAD; git ls-files --others --exclude-standard; } 2>/dev/null | grep -q "^infra/" && [ -d infra/node_modules ]; then (cd infra && pnpm exec tsc --noEmit); fi; }'

# Commits, PRs, summaries and agent comments are in Japanese. (The loop's own comments on GitHub are in English.)
AGENT_LANGUAGE=Japanese

# Triage: keep issues in sync with docs/plans/PLAN-*.md that have `status: active`.
AGENT_PLANS_GLOB='docs/plans/*.md'
AGENT_PLANS_ACTIVE_REGEX='^status: active'
AGENT_AUTOCREATE_LABELS='phase:*'

AGENT_IGNORE_CHECKS=claude-review
AGENT_IGNORE_FEEDBACK_USERS='vercel[bot] github-actions[bot]'
AGENT_CLEAN_REVIEW_USER='claude[bot]'

# Project tools the agents may run
AGENT_EXTRA_ALLOW=(
  "Bash(pnpm install:*)" "Bash(pnpm lint:*)" "Bash(pnpm test:*)" "Bash(pnpm build:*)" "Bash(pnpm exec tsc:*)"
  "Bash(pnpm exec vitest:*)" "Bash(pnpm exec eslint:*)" "Bash(pnpm exec cdk synth:*)"
)
# Production database, deploys and cloud. Written to match in the middle of a command (e.g. `supabase --workdir x db push`).
AGENT_EXTRA_DENY=(
  "Bash(*supabase*db push*)" "Bash(*supabase*link*)" "Bash(*supabase*--db-url*)" "Bash(*supabase*migration repair*)"
  "Bash(*supabase*secrets*)" "Bash(*supabase*deploy*)" "Bash(*supabase*projects*)"
  "Bash(*vercel*)" "Bash(aws:*)" "Bash(*&& aws *)" "Bash(*; aws *)" "Bash(*| aws *)" "Bash(*\$(aws *)"
  "Bash(*cdk deploy*)" "Bash(*cdk bootstrap*)" "Bash(*cdk destroy*)"
  "Read(~/.supabase/**)" "Bash(*.supabase/*)"
  "Read(~/Library/Application Support/com.vercel.cli/**)" "Bash(*com.vercel.cli*)"
)
# The read-only triage agent must not run package scripts either
AGENT_EXTRA_TRIAGE_DENY=("Bash(pnpm:*)" "Bash(npx:*)")
