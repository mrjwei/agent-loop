# agent-loop configuration for this project. Plain bash, sourced by agent-loop.
# Precedence: environment variable > this file > built-in default. Arrays can only be set here.
# Commit this file (and .agent-loop/) so agent worktrees and teammates see the same settings.

# --- What the agent runs ---
# Run in each worktree before the agent starts (dependency install etc.), in the agents' environment (see AGENT_SCRUB_ENV).
AGENT_SETUP_CMD='{{SETUP_CMD}}'
# Checks that must pass before a PR. Told to the agent, and run by a Stop hook before the agent may finish.
AGENT_VERIFY_CMD='{{VERIFY_CMD}}'
#AGENT_VERIFY_TIMEOUT=600      # seconds the Stop hook may spend on it
# Language of commits, PRs, summaries and agent comments.
#AGENT_LANGUAGE=English

# --- Git ---
# Branch PRs are based on. Default: origin's default branch, else main.
#AGENT_BASE_BRANCH=main
# Worktrees are created next to the repo as ../<prefix>-<issue-number>. Default: <repo-dir>-agent
#AGENT_WT_PREFIX={{WT_PREFIX}}

# --- Triage (optional): keep issues in sync with plan files ---
# Leave empty to disable. With it set, the loop creates/updates issues from the plans and decides which are agent-ok.
#AGENT_PLANS_GLOB='docs/plans/*.md'
# A plan counts as active when one of its lines matches this regex (empty = every plan counts).
#AGENT_PLANS_ACTIVE_REGEX='^status: active'
# Label families triage may create, as space-separated globs.
#AGENT_AUTOCREATE_LABELS='phase:*'

# --- Models and pacing ---
#AGENT_MODEL=claude-sonnet-5-5
#AGENT_EFFORT=high
#AGENT_TRIAGE_MODEL=claude-opus-5-5
#AGENT_ESCALATE_MODEL=claude-opus-5-5   # used for the last implement attempt and the last fix round (empty = AGENT_MODEL)
#AGENT_ESCALATE_EFFORT=max              # effort for those runs (empty = AGENT_EFFORT)
#AGENT_MAX_PARALLEL=2          # agents at once
#AGENT_POLL_SECONDS=300
#AGENT_MAX_ATTEMPTS=2          # implementation attempts before agent-blocked
#AGENT_MAX_FIXES=3             # fix rounds per PR before agent-blocked
#AGENT_PAUSE_AT_UTILIZATION=0.8  # stop starting agents at this share of a usage window
#AGENT_AUTO_RESUME=1           # a trusted author's answer on an agent-blocked issue removes the label (0 = remove it by hand)

# --- Limits (all computed by the scripts; API-equivalent dollars) ---
#AGENT_RUN_TIMEOUT=3600        # seconds one implement / fix run may take, then it is stopped and counts as a failed attempt (0 = no limit)
#AGENT_MAX_COST_PER_RUN=5      # passed to the claude CLI's own spend cap (--max-budget-usd) when the installed CLI has one
#AGENT_DAILY_BUDGET=50         # when today's spend reaches this, no agent starts until the next local day

# --- Feedback handling ---
#AGENT_IGNORE_CHECKS=claude-review          # CI checks (comma-separated) that never trigger a fix run
#AGENT_IGNORE_FEEDBACK_USERS='github-actions[bot]'  # bots whose comments are never feedback
#AGENT_CLEAN_REVIEW_USER='claude[bot]'      # "No issues found" from this user is not feedback
# Whose words the agents act on. Comments by anyone else never start a fix run or reach a prompt, and triage never
# adds agent-ok to their issues. Values are GitHub author associations; '*' trusts everyone (never on a public repo).
#AGENT_TRUSTED_ASSOCIATIONS='OWNER MEMBER COLLABORATOR'
#AGENT_TRUSTED_USERS='claude[bot]'          # logins trusted whatever their association (review bots)

# --- Notifications (an agent stopped, a PR opened, agents paused by a usage limit) ---
# The loop's comments on blocked issues and opened PRs mention this GitHub login, so GitHub sends a mobile push and an
# email with a link. GitHub does not notify you about your own comments: if the loop runs under your own `gh` account,
# use AGENT_NOTIFY_CMD as well, or run `gh` as a separate account.
AGENT_NOTIFY_USER='{{NOTIFY_USER}}'
# Optional: a command run with the title and body as arguments and the issue/PR URL in $AGENT_NOTIFY_URL, e.g. ntfy:
#AGENT_NOTIFY_CMD='ntfy_send() { curl -fsS -H "Title: $1" -H "Click: $AGENT_NOTIFY_URL" -d "$2" https://ntfy.sh/CHOOSE-A-SECRET-TOPIC >/dev/null; }; ntfy_send'
#AGENT_NOTIFY=0                # turn every notification off
#AGENT_DIGEST_HOUR=18          # send `agent-loop stats --digest` through AGENT_NOTIFY_CMD once a day, at this local hour

# --- Auto-merge: the loop merges the PR of an issue that YOU labeled agent-automerge, when every condition holds ---
#AGENT_AUTOMERGE=1                    # 0 ignores the label everywhere
#AGENT_AUTOMERGE_METHOD=squash        # squash | merge | rebase
#AGENT_AUTOMERGE_REQUIRE_REVIEW=      # e.g. 'claude[bot]': its latest review/comment must be clean ("No issues found")

# --- Safety (best effort, not a sandbox: the agents run with your permissions) ---
# Extra permission rules for the agents, in Claude Code's --allowedTools / --disallowedTools syntax.
# Deny every deploy, production-database and cloud command your project could run.
#AGENT_EXTRA_ALLOW=("Bash(npm test:*)")
#AGENT_EXTRA_DENY=("Bash(*terraform apply*)" "Bash(*kubectl*)")
#AGENT_EXTRA_TRIAGE_DENY=("Bash(npm:*)")   # the read-only triage agent
# Environment variables removed from the environment of the agents and of AGENT_SETUP_CMD (replaces the built-in list
# of common cloud tokens). If the install needs one of them, e.g. NPM_TOKEN for a private registry, leave it out here.
#AGENT_SCRUB_ENV='AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN'
# Environment variables set for the agents.
#AGENT_CHILD_ENV=(AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null)
